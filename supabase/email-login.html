<!-- Supabase → Authentication → Emails → Magic Link 的正文。主题建议：sealonote 登录验证码 -->
<!-- 邮件里只能用表格 + 行内样式（Gmail / Outlook 会去掉 <style> 和 SVG），配色跟 App 的「墨白」主题一致 -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#F7F7F5;padding:40px 16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Helvetica,Arial,sans-serif;color:#37352F">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:440px">
        <tr>
          <td style="padding:0 4px 18px">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td style="vertical-align:middle"><img src="https://www.sealonote.com/assets/icon-192.png" width="28" height="28" alt="" style="display:block;border:0;border-radius:7px"></td>
                <td style="vertical-align:middle;padding-left:9px;font-size:16px;font-weight:700;letter-spacing:-0.02em;color:#1F1E1C">sealonote <span style="font-weight:400;font-size:13px;color:#787774;letter-spacing:0">海豹笔记</span></td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td style="background:#FFFFFF;border:1px solid #EDECE9;border-radius:18px;padding:32px 28px 28px">
            <p style="margin:0;font-size:13px;color:#2383E2;font-weight:500">登录验证码</p>
            <p style="margin:6px 0 0;font-size:22px;line-height:1.3;font-weight:700;letter-spacing:-0.02em;color:#1F1E1C">嗨，汤圆来送验证码了</p>
            <p style="margin:10px 0 0;font-size:14px;line-height:1.7;color:#5F5E5B">把下面这 6 位数填回登录页就好。</p>
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:22px 0 0">
              <tr>
                <td align="center" style="background:#F7F7F5;border:1px solid #EDECE9;border-radius:14px;padding:18px 12px">
                  <span style="font-size:32px;line-height:1;font-weight:700;letter-spacing:10px;padding-left:10px;color:#1F1E1C;font-variant-numeric:tabular-nums">{{ .Token }}</span>
                </td>
              </tr>
            </table>
            <p style="margin:18px 0 0;font-size:13px;line-height:1.7;color:#787774">10 分钟内有效，用过一次就失效。<br>不是你本人在登录的话，忽略这封邮件就好，账号不会有变化。</p>
          </td>
        </tr>
        <tr>
          <td style="padding:18px 4px 0;font-size:12px;line-height:1.7;color:#9B9A97">
            这封邮件是因为有人用 {{ .Email }} 登录 sealonote 发出的。<br>
            <a href="https://www.sealonote.com" style="color:#9B9A97;text-decoration:underline">www.sealonote.com</a>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
