<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#f8f9fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0b0d" media="(prefers-color-scheme: dark)">
<title>yunningtang OS</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<script>
// Apply the saved theme before first paint so there is no flash.
try {
  var s = JSON.parse(localStorage.getItem('ytos.v1') || '{}');
  var t = (s.settings && s.settings.theme) || 'auto';
  if (t === 'auto') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.dataset.theme = t;
} catch (e) {}
</script>
</head>
<body>
<canvas id="ripple"></canvas>
<div class="ocean" aria-hidden="true"><div class="b b1"></div><div class="b b2"></div><div class="b b3"></div></div>
<div id="app"></div>
<noscript>这个页面需要启用 JavaScript。</noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
